- id: code_review_bug_detection
  targets: [code-review]
  category: skill
  difficulty: easy
  scenario_type: single_turn
  prompt: |
    Review this code:
    ```python
    def divide_values(items: list[dict]) -> list[float]:
        results = []
        for item in items:
            results.append(item['numerator'] / item['denominator'])
        return results
    ```
  context: >
    Code with a potential ZeroDivisionError. The review should catch it.
  rubric:
    correctness:
      - criterion: "Identifies the ZeroDivisionError risk when denominator is 0"
        weight: 3
      - criterion: "Assigns a severity level (CRITICAL or HIGH)"
        weight: 2
      - criterion: "Provides a concrete fix suggestion (check for zero, handle the error)"
        weight: 2
      - criterion: "Uses the severity model format from the skill"
        weight: 2
    negative:
      - criterion: "Does NOT approve the code without mentioning the division by zero risk"
        weight: 3

- id: code_review_good_code
  targets: [code-review]
  category: skill
  difficulty: easy
  scenario_type: single_turn
  prompt: |
    Review this code:
    ```python
    from pathlib import Path
    from dataclasses import dataclass

    @dataclass(frozen=True)
    class Config:
        db_host: str
        db_port: int
        db_name: str

        @classmethod
        def from_env(cls) -> "Config":
            import os
            return cls(
                db_host=os.environ["DB_HOST"],
                db_port=int(os.environ["DB_PORT"]),
                db_name=os.environ["DB_NAME"],
            )
    ```
  context: >
    Clean, well-structured code. The review should acknowledge good patterns.
  rubric:
    correctness:
      - criterion: "Acknowledges good patterns (frozen dataclass, type hints, classmethod factory)"
        weight: 3
      - criterion: "Has a 'What Was Done Well' section or equivalent positive feedback"
        weight: 2
    negative:
      - criterion: "Does NOT only list problems without mentioning anything positive"
        weight: 3

