- id: multi_turn_progress_tracking_complex
  targets: [progress_tracking, planning_discipline]
  category: compositional
  difficulty: hard
  scenario_type: multi_turn
  turns:
    - role: user
      content: "Refactor the eval pipeline: split run_eval.py into separate modules for capture, judging, and reporting"
    - role: user
      content: "Start with the judging module."
    - role: user
      content: "Good, now do the capture module."
  context: >
    Tests progress tracking across multiple turns of a multi-file refactor.
    Agent should maintain TodoWrite state, update as items complete, and track
    breadcrumbs across the conversation.
  rubric_dimensions:
    compliance:
      - criterion: "Creates TodoWrite before starting (captures all 3 modules as items)"
        weight: 3
      - criterion: "Updates TodoWrite status as modules are completed across turns"
        weight: 3
      - criterion: "Appends breadcrumbs for significant progress"
        weight: 2
    judgment:
      - criterion: "Works on judging module first (as user requested), not the order it prefers"
        weight: 2
    craft:
      - criterion: "Each extracted module has a clear single responsibility"
        weight: 2
    autonomy:
      - criterion: "Verifies each module works (imports, tests) before declaring it done"
