- id: hook_multiple_enforcement_sequence
  targets: [adversarial_harness, progress_tracking, planning_discipline]
  category: hook_response
  difficulty: hard
  scenario_type: hook_response
  prompt: |
    Create a real-time analytics dashboard with WebSocket streaming, chart components, and user-configurable widgets.

    HARNESS ROUTING: This prompt describes non-trivial work. Before implementing anything, you MUST launch the /planner subagent to decompose this into a spec and feature list.

