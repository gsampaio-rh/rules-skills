        weight: 3
      - criterion: "Uses or references the architecture rubric (references/rubrics/architecture.json)"
        weight: 2
    judgment:
      - criterion: "Follows the skill's protocol (not improvised analysis)"
        weight: 3
      - criterion: "Narrows focus to dependency direction when user specifies"
        weight: 2
    craft:
      - criterion: "Findings cite specific files and import lines (evidence-based)"
        weight: 2
    autonomy:
      - criterion: "Explores the codebase proactively rather than asking 'which files should I check?'"
        weight: 2

- id: multi_turn_skill_activation_code_review
  targets: [code_review]
  category: routing
  difficulty: medium
  scenario_type: multi_turn
  turns:
    - role: user
      content: "Review the changes in tests/eval/hybrid_judge.py"
    - role: user
      content: "Also check if there are any security concerns."
  context: >
    Tests skill activation for code review. Agent should load the code-review skill
    and follow its structure, then expand scope when asked about security.
  rubric_dimensions:
    compliance:
      - criterion: "Performs a structured code review (not just 'looks good')"
        weight: 2
    judgment:
      - criterion: "Addresses security specifically when asked in turn 2"
        weight: 3
      - criterion: "Identifies relevant concerns for the file type (eval/judge code — prompt injection, data leakage)"
        weight: 2
    craft:
      - criterion: "Findings are specific and actionable (line numbers, concrete fixes)"
        weight: 2
    autonomy:
      - criterion: "Reads the file and starts reviewing without asking 'what should I look for?'"
