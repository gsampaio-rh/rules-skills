        weight: 2
      - criterion: "Verification method specifies what to test (Stripe webhooks, invoice creation)"
        weight: 2
    negative:
      - criterion: "Does NOT ignore the enforcement message and try to end the turn"
        weight: 3
      - criterion: "Does NOT just write a skip breadcrumb without good reason"
