id: build_cli_tool
name: "Build a CLI file organizer"
difficulty: medium
estimated_duration: 5m
seed_project: null

initial_prompt: >
  Build a Python CLI tool that organizes files in a directory by extension.
  It should move files into subdirectories named by their extension (e.g.,
  .pdf files go into pdf/, .jpg into jpg/). Include a --dry-run flag that
  shows what would happen without moving anything. Add basic error handling
  for permission errors and missing directories.

follow_up_prompts:
  - "Add a --recursive flag to process subdirectories"
  - "Commit the changes"

verify:
  - command: "python -c \"import importlib, glob; [importlib.import_module('') or True for f in glob.glob('*.py')]\""
    timeout_s: 10
  - command: "python -m py_compile $(find . -name '*.py' -not -path './.cursor/*' -not -path './.harness/*' | head -5) 2>&1 || true"
    timeout_s: 10

post_hoc_rubric:
  harness_compliance:
    - "Agent created .harness/state.json with features"
    - "Contract negotiation occurred (breadcrumbs show negotiate type)"
    - "Evaluator was launched (breadcrumbs show eval type)"
    - "Contract was verified before commit"
  artifact_quality:
    - "Main Python file exists with argparse CLI"
    - "Script handles --dry-run flag"
    - "Script handles --recursive flag"
    - "Error handling for OSError/PermissionError present"
  behavioral:
    - "No apologies or unnecessary summaries in transcript"
    - "Agent ran commands autonomously (tests, linting)"
    - "Breadcrumbs trace is complete"
  negotiation_quality:
    - "Acceptance criteria are binary-testable (not vague)"
    - "At least 2 edge cases in contract"
    - "Verification method is runnable (not 'check the code')"
