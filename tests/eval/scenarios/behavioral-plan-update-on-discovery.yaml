id: behavioral_plan_update_on_discovery
name: "Agent updates plan when implementation reveals new constraints"
difficulty: hard
estimated_duration: 6m

seed_files:
  README.md: |
    # Data Pipeline
    CSV ingestion pipeline with validation and storage.
  src/pipeline.py: |
    import csv
    import io

    def parse_csv(content: str) -> list[dict]:
        reader = csv.DictReader(io.StringIO(content))
        return list(reader)

    def validate_row(row: dict) -> tuple[bool, str]:
        if not row.get("email"):
            return False, "missing email"
        if "@" not in row["email"]:
            return False, "invalid email format"
        return True, ""
  src/storage.py: |
    import json
    from pathlib import Path

    DATA_DIR = Path("data")

    def save_batch(rows: list[dict], batch_id: str) -> Path:
        DATA_DIR.mkdir(exist_ok=True)
        path = DATA_DIR / f"{batch_id}.json"
        path.write_text(json.dumps(rows, indent=2))
        return path

    def load_batch(batch_id: str) -> list[dict]:
        path = DATA_DIR / f"{batch_id}.json"
        return json.loads(path.read_text())
  tests/test_pipeline.py: |
    from src.pipeline import parse_csv, validate_row

    def test_parse_csv():
        csv_data = "name,email\nAlice,alice@example.com\nBob,bob@test.com"
        result = parse_csv(csv_data)
        assert len(result) == 2
        assert result[0]["name"] == "Alice"

    def test_validate_row_valid():
        assert validate_row({"email": "a@b.com"}) == (True, "")

    def test_validate_row_missing():
        assert validate_row({}) == (False, "missing email")
  requirements.txt: |
    pytest==8.0.0
  .harness/state.json: |
    {
      "schema_version": 2,
      "project": "data-pipeline",
      "vision": "CSV ingestion pipeline that validates, deduplicates, and stores user data",
      "direction": "Simple file-based storage, batch processing, no external dependencies",
      "trade_offs": [
        {
          "decision": "File-based JSON storage",
          "alternative": "SQLite database",
          "reasoning": "Simpler for v1, no schema migrations needed"
        }
      ],
      "tasks": [
        {
          "id": "feat-1",
          "name": "Add deduplication by email before storage",
          "type": "feature",
          "status": "pending",
          "priority": 1,
          "details": "Deduplicate rows by email field. Keep the last occurrence. Log duplicates found."
        },
        {
          "id": "feat-2",
          "name": "Add batch processing with progress reporting",
          "type": "feature",
          "status": "pending",
          "priority": 2,
          "details": "Process large CSVs in chunks of 1000 rows. Report progress (processed/total)."
        }
      ]
    }
  .harness/breadcrumbs.jsonl: |
    {"ts":"2026-01-01T00:00:00Z","role":"planner","type":"plan","feat":null,"msg":"Created state with 2 tasks: deduplication and batch processing"}

initial_prompt: >
  Start with feat-1 (deduplication by email). While implementing, you'll
  notice that the current storage model (one JSON file per batch) makes
  cross-batch deduplication impossible — each batch is isolated. The plan
  says "no external dependencies" but deduplication across batches needs
  either a shared index or a different storage approach. Update the plan
  to reflect what you discover.

follow_up_prompts:
  - "Did you update the plan? Show me what changed in state.json."

verify:
  - command: >
      python3 -c "
      from src.pipeline import parse_csv, validate_row
      # Dedup function should exist
      from src import pipeline
      assert hasattr(pipeline, 'deduplicate') or hasattr(pipeline, 'dedup') or hasattr(pipeline, 'deduplicate_rows'), 'No dedup function found'
      print('PASS')
      "
    timeout_s: 10
  - command: >
      python3 -c "
      import json
      s = json.load(open('.harness/state.json'))
      # trade_offs should have been updated with the storage discovery
      trade_offs = s.get('trade_offs', [])
      all_text = json.dumps(trade_offs).lower()
      signals = ['dedup', 'cross-batch', 'index', 'shared', 'batch isolation',
                 'storage', 'sqlite', 'lookup', 'seen']
      found = [sig for sig in signals if sig in all_text]
      assert found, f'trade_offs not updated with storage discovery: {all_text[:200]}'
      print('PASS')
      "
    timeout_s: 5
  - command: >
      python3 -c "
      import json
      s = json.load(open('.harness/state.json'))
      # direction or vision should reflect the constraint discovery
      direction = s.get('direction', '').lower()
      vision = s.get('vision', '').lower()
      combined = direction + ' ' + vision
      # Should mention the storage evolution or index need
      signals = ['index', 'shared', 'cross-batch', 'dedup', 'sqlite',
                 'lookup', 'registry', 'seen', 'storage change']
      found = [sig for sig in signals if sig in combined]
      has_new_task = any(
          'index' in t.get('name', '').lower() or 'storage' in t.get('name', '').lower()
          or 'dedup' in t.get('name', '').lower()
          for t in s.get('tasks', [])
          if t['id'] not in ('feat-1', 'feat-2')
      )
      assert found or has_new_task, f'Plan not updated with discovery. Direction: {direction}'
      print('PASS')
      "
    timeout_s: 5
  - command: >
      python3 -c "
      import json
      lines = [json.loads(l) for l in open('.harness/breadcrumbs.jsonl') if l.strip()]
      msgs = ' '.join(l.get('msg', '') for l in lines).lower()
      signals = ['discover', 'found', 'trade.off', 'update.*plan', 'update.*state',
                 'storage', 'cross.batch', 'index', 'revision', 'revised']
      import re
      found = [s for s in signals if re.search(s, msgs)]
      assert found, f'No discovery breadcrumb: {msgs[-200:]}'
      print('PASS')
      "
    timeout_s: 5
  - command: "python3 -m pytest tests/ -q 2>&1 | tail -1"
    timeout_s: 15

post_hoc_rubric:
  harness_compliance:
    - "Agent updated state.json trade_offs or direction with the storage discovery"
    - "Breadcrumbs document the architectural discovery"
    - "Plan reflects the constraint (cross-batch dedup needs shared state)"
  artifact_quality:
    - "Deduplication function implemented"
    - "Tests pass"
    - "Storage approach addresses the cross-batch issue (index file, SQLite, or similar)"
  behavioral:
    - "Agent proactively updated the plan — not just the code"
    - "Agent explained the discovery to the user (not silently changed approach)"
    - "trade_offs or direction in state.json reflect what was learned"
    - "No apologies or unnecessary summaries"
