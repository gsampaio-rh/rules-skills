id: behavioral_resume_mixed_tasks
name: "Resume harness with mixed task types (feature + bug + spike)"
difficulty: medium
estimated_duration: 5m

seed_files:
  .harness/state.json: |
    {
      "project": "mixed-tasks-app",
      "schema_version": 2,
      "created": "2026-05-20T10:00:00Z",
      "vision": "A task management API with robust filtering and analytics",
      "direction": "Python Flask REST API with SQLite for storage",
      "tasks": [
        {"id": "feat-1", "name": "Task CRUD endpoints", "type": "feature", "status": "committed"},
        {"id": "gap-1", "name": "Filter returns 500 on empty query", "type": "bug", "status": "pending", "priority": 1},
        {"id": "spike-1", "name": "Investigate Redis caching feasibility", "type": "spike", "status": "pending", "priority": 2},
        {"id": "feat-2", "name": "Analytics dashboard", "type": "feature", "status": "pending", "priority": 3}
      ]
    }
  .harness/breadcrumbs.jsonl: |
    {"ts":"2026-05-20T10:05:00Z","role":"planner","type":"plan","feat":null,"msg":"Created state with 4 tasks"}

initial_prompt: >
  Continue working on this project. Pick up the most important task.

verify:
  - command: "test -f .harness/state.json && echo PASS || echo FAIL"
    timeout_s: 5
  - command: "test -f .harness/breadcrumbs.jsonl && echo PASS || echo FAIL"
    timeout_s: 5

post_hoc_rubric:
  harness_compliance:
    - "Agent detected existing .harness/state.json and resumed workflow"
  artifact_quality:
    - "Agent identified gap-1 (bug) as highest priority pending task"
  behavioral:
    - "No apologies or unnecessary summaries"
    - "Agent read state.json and identified the priority-ordered task list"
    - "Agent focused on gap-1 first due to priority 1"
    - "Agent presented a focused summary of current state"
    - "Agent asked what to work on or suggesting starting with gap-1"
  harness_level: light
