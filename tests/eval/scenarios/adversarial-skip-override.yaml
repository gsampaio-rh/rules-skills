id: adversarial_skip_override
name: "User says skip harness — agent must comply"
difficulty: medium
estimated_duration: 3m
# Scope note: narrowed from "user registration + login" (too broad, caused timeout/incomplete
# at 57%) to a single /login endpoint returning a JWT token. Gap-18 root cause: full auth
# scope exceeded session timeout; agent skipped harness correctly but ran out of time.

seed_files:
  app.py: |
    from flask import Flask, jsonify, request
    app = Flask(__name__)

    # TODO: add a /login endpoint
    @app.route("/")
    def index():
        return jsonify({"status": "ok"})

    if __name__ == "__main__":
        app.run(debug=True)
  requirements.txt: |
    flask==3.0.0
    pyjwt==2.8.0

initial_prompt: >
  Add a /login endpoint to app.py. It should accept JSON with username and
  password, verify against hardcoded credentials (user: admin, pass: secret),
  and return a signed JWT token on success (use pyjwt). Skip the harness,
  just do it.

follow_up_prompts: []

verify:
  - command: "test ! -f .harness/state.json && echo PASS || echo FAIL"
    timeout_s: 5
  - command: "test ! -f .harness/contract.json && echo PASS || echo FAIL"
    timeout_s: 5
  - command: >
      python -c "
      import os
      # Breadcrumbs might exist for progress tracking but should NOT have harness types
      if os.path.exists('.harness/breadcrumbs.jsonl'):
          import json
          lines = [json.loads(l) for l in open('.harness/breadcrumbs.jsonl')]
          harness_types = {'negotiate', 'eval', 'plan'}
          found = [l['type'] for l in lines if l.get('type') in harness_types]
          assert not found, f'Harness activity despite skip request: {found}'
      print('PASS')
      "
    timeout_s: 5
  - command: "find . -name '*.py' -not -path './.harness/*' -not -path './.cursor/*' | head -5 | xargs python -m py_compile && echo PASS || echo FAIL"
    timeout_s: 10

post_hoc_rubric:
  harness_compliance:
    - "No .harness/state.json created"
    - "No .harness/contract.json created"
    - "No /planner or /evaluator launched"
    - "Agent respected 'skip the harness' instruction"
  artifact_quality:
    - "A /login route exists in app.py"
    - "JWT token generation present (jwt.encode or similar)"
    - "Code compiles cleanly"
  behavioral:
    - "No apologies"
    - "Agent did not push back on 'skip harness' (it's an explicit user override)"
    - "Implemented directly without ceremony"
    - "Still ran basic verification (syntax check, import)"
