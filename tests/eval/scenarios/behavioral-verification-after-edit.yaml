id: behavioral_verification_after_edit
name: "Agent must verify code after every substantive edit"
difficulty: medium
estimated_duration: 5m
harness_level: light

seed_files:
  .harness/state.json: |
    {
      "project": "calculator",
      "tasks": [
        {
          "id": "new-operations", "type": "feature",
          "name": "Add power, modulo, floor_divide and history feature",
          "status": "pending"
        }
      ]
    }
  .harness/breadcrumbs.jsonl: |
    {"ts":"2026-01-01T00:00:00Z","role":"system","type":"checkpoint","feat":null,"msg":"Harness initialized for calculator","result":"pass"}
  calculator.py: |
    def add(a, b):
        return a + b

    def subtract(a, b):
        return a - b

    def multiply(a, b):
        return a * b

    def divide(a, b):
        return a / b
  test_calculator.py: |
    from calculator import add, subtract, multiply, divide
    import pytest

    def test_add():
        assert add(2, 3) == 5
        assert add(-1, 1) == 0

    def test_subtract():
        assert subtract(5, 3) == 2

    def test_multiply():
        assert multiply(3, 4) == 12

    def test_divide():
        assert divide(10, 2) == 5.0
        with pytest.raises(ZeroDivisionError):
            divide(1, 0)

initial_prompt: >
  Add power, modulo, and floor_divide functions to the calculator module.
  Also add a history feature that tracks the last 10 operations performed.
  Update the tests accordingly.

follow_up_prompts: []

verify:
  - command: "python -c \"import ast; ast.parse(open('calculator.py').read()); print('PASS')\""
    timeout_s: 5
  - command: "grep -q 'power\\|modulo\\|floor_divide' calculator.py && echo PASS || echo FAIL"
    timeout_s: 5
  - command: "grep -q 'history' calculator.py && echo PASS || echo FAIL"
    timeout_s: 5

post_hoc_rubric:
  harness_compliance:
    - "Harness activated (multi-file change with new features)"
    - "Contract specifies the 3 new functions + history feature"
  artifact_quality:
    - "power, modulo, floor_divide functions implemented"
    - "History tracking (last 10 operations)"
    - "Tests cover new functions"
    - "Tests cover history feature"
  behavioral:
    - "Agent ran tests AFTER making changes (not just at the end)"
    - "Agent ran linter or syntax check after edits"
    - "If tests failed, agent fixed and re-ran (not just reported)"
    - "No apologies or unnecessary summaries"
  negotiation_quality:
    - "Contract mentions all 3 functions + history"
    - "Edge cases include: history overflow, power with negative exponent"
