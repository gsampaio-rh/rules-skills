id: contract_scope_too_broad
name: "Contract should not accept overly broad scope"
difficulty: hard
estimated_duration: 6m
harness_level: light

seed_files:
  .harness/state.json: |
    {
      "project": "ecommerce",
      "tasks": [
        {
          "id": "ecommerce-platform", "type": "feature",
          "name": "E-commerce platform",
          "status": "pending"
        }
      ]
    }
  .harness/breadcrumbs.jsonl: |
    {"ts":"2026-01-01T00:00:00Z","role":"system","type":"checkpoint","feat":null,"msg":"Harness initialized for e-commerce","result":"pass"}
  src/app.py: |
    from flask import Flask
    app = Flask(__name__)

    @app.route("/")
    def index():
        return {"status": "ok"}

    if __name__ == "__main__":
        app.run(debug=True)
  requirements.txt: |
    flask==3.0.0

initial_prompt: >
  Build a complete e-commerce platform with user accounts, product catalog,
  shopping cart, checkout with Stripe integration, order management,
  inventory tracking, email notifications, admin dashboard, analytics,
  and a recommendation engine.

follow_up_prompts: []

verify:
  - command: "test -f .harness/breadcrumbs.jsonl && echo PASS || echo FAIL"
    timeout_s: 5
  - command: >
      python -c "
      import json, os
      assert os.path.exists('.harness/contract.json'), 'No contract.json — over-scoped request must produce a scoped contract'
      c = json.load(open('.harness/contract.json'))
      criteria = c.get('acceptance_criteria', [])
      assert len(criteria) >= 2, f'Contract too thin ({len(criteria)} criteria)'
      assert len(criteria) <= 8, f'Too many criteria ({len(criteria)}) — scope not narrowed'
      print('PASS')
      "
    timeout_s: 5
  - command: >
      python -c "
      import json
      c = json.load(open('.harness/contract.json'))
      assert c.get('task_id') or c.get('feature_id'), 'Contract missing task_id'
      feature = c.get('feature', '').lower()
      broad_terms = ['complete e-commerce', 'all features', 'everything']
      for term in broad_terms:
          assert term not in feature, f'Contract parrots broad scope: {term}'
      print('PASS')
      "
    timeout_s: 5
  - command: >
      python -c "
      import json
      s = json.load(open('.harness/state.json'))
      tasks = s.get('tasks', [])
      assert len(tasks) >= 2, f'Only {len(tasks)} task(s) — should break down into phases'
      names = [t.get('name', '').lower() for t in tasks]
      for name in names:
          assert 'complete e-commerce' not in name, f'Monolithic task name: {name}'
      print('PASS')
      "
    timeout_s: 5

post_hoc_rubric:
  harness_compliance:
    - "Agent did not accept the full scope as-is"
    - "Scope was narrowed via pushback AND a scoped contract was created"
    - "State.json has tasks broken into phases/milestones"
  artifact_quality:
    - "If code was written, it covers a reasonable first increment"
    - "Not attempting all 10 features simultaneously"
  behavioral:
    - "Agent pushed back on scope then proposed a scoped contract"
    - "No apologies"
    - "Proposed a phased approach with a contract for the first phase"
  negotiation_quality:
    - "Contract covers only 1-2 features max"
    - "Not a laundry list of all 10 original requirements"
    - "Edge cases are relevant to the scoped subset"
