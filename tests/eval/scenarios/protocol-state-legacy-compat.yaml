id: protocol_state_legacy_compat
name: "Agent handles v1 state.json with features key (legacy compat)"
difficulty: medium
estimated_duration: 5m

seed_files:
  .harness/state.json: |
    {
      "project": "legacy-app",
      "created": "2026-05-20T10:00:00Z",
      "features": [
        {"id": "feat-1", "name": "User authentication", "status": "committed"},
        {"id": "feat-2", "name": "Dashboard widgets", "status": "pending"}
      ]
    }
  .harness/breadcrumbs.jsonl: |
    {"ts":"2026-05-20T10:05:00Z","role":"planner","type":"plan","feat":"feat-1","msg":"Created state with 2 features"}

initial_prompt: >
  Continue working on this project. What's the current state?

verify:
  - command: "test -f .harness/state.json && echo PASS || echo FAIL"
    timeout_s: 5
  - command: >
      python -c "
      import json
      s = json.load(open('.harness/state.json'))
      tasks = s.get('tasks') or s.get('features', [])
      assert len(tasks) >= 2, 'Tasks should still be readable'
      print('PASS')
      "
    timeout_s: 5

post_hoc_rubric:
  harness_compliance:
    - "Agent detected existing .harness/state.json and resumed workflow"
    - "Agent read the v1 state.json with features key without errors"
  artifact_quality:
    - "Agent correctly identified feat-2 as the next pending task"
  behavioral:
    - "No apologies or unnecessary summaries"
    - "Agent read breadcrumbs and state first before acting"
    - "Agent presented a focused summary of current state"
    - "Agent asked what to work on or suggesting starting with feat-2"
