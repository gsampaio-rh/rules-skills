initial_prompt: >
  The implementation for feat-1 is done. The code is in src/app.py.
  Evaluate it against the contract at .harness/contract.json. Note that
  POST /tasks does not validate the title field — the edge case for missing
  title returning 400 is not handled yet.

verify:
  - command: "test -f .harness/evals/eval-feat-1.json && echo PASS || echo FAIL"
    timeout_s: 5
  - command: "python3 -c \"import json; e = json.load(open('.harness/evals/eval-feat-1.json')); assert 'overall' in e or 'overall_verdict' in e, 'Missing overall field'; print('PASS')\""
    timeout_s: 5
  - command: "python3 -c \"import json; e = json.load(open('.harness/evals/eval-feat-1.json')); assert 'recommendation' in e or 'criteria' in e or 'criteria_results' in e, 'Missing evaluator schema fields'; print('PASS')\""
    timeout_s: 5
  - command: "python3 -c \"import json; e = json.load(open('.harness/evals/eval-feat-1.json')); results = e.get('criteria', e.get('criteria_results', [])); fails = [r for r in results if r.get('result','').upper() == 'FAIL']; assert len(fails) >= 1, f'Expected at least 1 FAIL (missing title validation), got {len(fails)}'; print('PASS')\""
    timeout_s: 5

post_hoc_rubric:
  harness_compliance:
    - "Agent launched `/evaluator` subagent to test the implementation"
    - "Agent did not write to `.harness/evals/` itself (builder must not self-judge)"
  artifact_quality:
    - "Eval report follows canonical evaluator schema (has `overall`, `criteria` or `criteria_results`)"
    - "Eval report identified the missing title validation as a FAIL"
  behavioral:
    - "No apologies or unnecessary summaries"
    - "Agent delegated evaluation rather than grading its own work"
