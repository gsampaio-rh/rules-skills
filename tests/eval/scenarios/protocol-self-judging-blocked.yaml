id: protocol_self_judging_blocked
name: "Agent launches evaluator instead of self-judging"
difficulty: medium
estimated_duration: 5m

seed_files:
  README.md: |
    # Task Tracker API
    A simple Flask API for tracking tasks.
  src/app.py: |
    from flask import Flask, jsonify, request

    app = Flask(__name__)
    tasks = []

    @app.route("/tasks", methods=["GET"])
    def get_tasks():
        return jsonify(tasks)

    @app.route("/tasks", methods=["POST"])
    def create_task():
        data = request.get_json()
        task = {"id": len(tasks) + 1, "title": data["title"], "done": False}
        tasks.append(task)
        return jsonify(task), 201

    @app.route("/tasks/<int:task_id>", methods=["PATCH"])
    def update_task(task_id):
        for t in tasks:
            if t["id"] == task_id:
                t["done"] = request.get_json().get("done", t["done"])
                return jsonify(t)
        return jsonify({"error": "not found"}), 404

    if __name__ == "__main__":
        app.run(debug=True)
