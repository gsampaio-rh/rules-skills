id: routing_ambiguous_escalate
name: "Ambiguous complexity — agent must decide routing"
difficulty: medium
estimated_duration: 6m
harness_level: light

seed_files:
  .harness/state.json: |
    {
      "project": "myapp",
      "tasks": [
        {
          "id": "dark-mode", "type": "feature",
          "name": "Dark mode with localStorage persistence",
          "status": "pending"
        }
      ]
    }
  .harness/breadcrumbs.jsonl: |
    {"ts":"2026-01-01T00:00:00Z","role":"system","type":"checkpoint","feat":null,"msg":"Harness initialized for dark mode feature","result":"pass"}
  src/components/Header.tsx: |
    export function Header() {
      return <header className="bg-white shadow p-4"><h1>MyApp</h1></header>;
    }
  src/components/Sidebar.tsx: |
    export function Sidebar() {
      return <aside className="w-64 bg-gray-100 p-4"><nav>Menu</nav></aside>;
    }
  src/components/Footer.tsx: |
    export function Footer() {
      return <footer className="bg-white border-t p-4">© 2026</footer>;
    }
  src/components/Card.tsx: |
    export function Card({ title, children }) {
      return <div className="bg-white rounded shadow p-4"><h2>{title}</h2>{children}</div>;
    }
  src/App.tsx: |
    import { Header } from './components/Header';
    import { Sidebar } from './components/Sidebar';
    import { Footer } from './components/Footer';
    import { Card } from './components/Card';

    export default function App() {
      return (
        <div className="min-h-screen bg-gray-50">
          <Header />
          <div className="flex">
            <Sidebar />
            <main className="flex-1 p-6">
              <Card title="Welcome">Content here</Card>
            </main>
          </div>
          <Footer />
        </div>
      );
    }
  tailwind.config.js: |
    module.exports = { content: ["./src/**/*.{ts,tsx}"], theme: { extend: {} } };
  package.json: |
    { "name": "myapp", "dependencies": { "react": "^18.0.0", "tailwindcss": "^3.0.0" } }

initial_prompt: >
  Add dark mode to the app. It should toggle via a button in the header
  and persist the user's preference in localStorage.

follow_up_prompts: []

verify:
  - command: "test -f .harness/state.json && echo PASS || echo FAIL"
    timeout_s: 5
  - command: "test -f .harness/contract.json && echo PASS || echo FAIL"
    timeout_s: 5
  - command: "test -f .harness/breadcrumbs.jsonl && echo PASS || echo FAIL"
    timeout_s: 5
  - command: "python -c \"import json; c=json.load(open('.harness/contract.json')); assert len(c.get('acceptance_criteria',[]))>=2; print('PASS')\""
    timeout_s: 5

post_hoc_rubric:
  harness_compliance:
    - "Agent activated harness (task touches 4+ components = non-trivial)"
    - "Contract negotiation occurred"
    - "State.json has feature with status progression"
  artifact_quality:
    - "Dark mode toggle button exists in Header"
    - "localStorage persistence implemented"
    - "Multiple components updated with dark mode classes"
    - "Tailwind dark mode configured (class strategy)"
  behavioral:
    - "No apologies or unnecessary summaries"
    - "Agent identified this as multi-file (not trivial) and activated harness"
    - "Verification attempted (build check or similar)"
  negotiation_quality:
    - "Contract mentions localStorage persistence"
    - "Edge cases include: initial load without preference, system preference fallback"
