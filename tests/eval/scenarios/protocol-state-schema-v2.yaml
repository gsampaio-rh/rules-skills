id: protocol_state_schema_v2
name: "Planner produces state.json with v2 schema (tasks, types, statuses)"
difficulty: medium
estimated_duration: 5m

initial_prompt: >
  Build a URL shortener API with click tracking. Plan it first using the adversarial harness.

verify:
  - command: "test -f .harness/state.json && echo PASS || echo FAIL"
    timeout_s: 5
  - command: >
      python -c "
      import json
      s = json.load(open('.harness/state.json'))
      tasks = s.get('tasks') or s.get('features', [])
      assert len(tasks) >= 2, f'Need at least 2 tasks, got {len(tasks)}'
      for t in tasks:
          assert 'type' in t or 'id' in t, f'Task missing type or id: {t}'
      print('PASS')
      "
    timeout_s: 5
  - command: >
      python -c "
      import json
      s = json.load(open('.harness/state.json'))
      assert 'vision' in s, 'Missing vision'
      assert 'direction' in s, 'Missing direction'
      print('PASS')
      "
    timeout_s: 5

post_hoc_rubric:
  harness_compliance:
    - "Agent created .harness/state.json with tasks"
    - "Agent launched /planner subagent"
  artifact_quality:
    - "state.json has vision and direction fields"
    - "Tasks have id and name fields"
    - "Tasks have status field set to pending"
  behavioral:
    - "No apologies or unnecessary summaries"
    - "Agent identified complexity and routed to planner"
