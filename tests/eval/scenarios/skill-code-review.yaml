id: skill_code_review
name: "Code-review skill activates for review request"
difficulty: medium
estimated_duration: 4m

seed_files:
  auth.py: |
    import hashlib
    import sqlite3
    import os

    DB = "users.db"
    SECRET = "supersecret123"

    def init_db():
        conn = sqlite3.connect(DB)
        conn.execute("CREATE TABLE IF NOT EXISTS users (id INTEGER PRIMARY KEY, username TEXT, password TEXT, token TEXT)")
        conn.commit()
        conn.close()

    def register(username, password):
        conn = sqlite3.connect(DB)
        hashed = hashlib.md5(password.encode()).hexdigest()
        conn.execute("INSERT INTO users (username, password) VALUES ('" + username + "', '" + hashed + "')")
        conn.commit()
        conn.close()
        return True

    def login(username, password):
        conn = sqlite3.connect(DB)
        hashed = hashlib.md5(password.encode()).hexdigest()
        cursor = conn.execute("SELECT * FROM users WHERE username='" + username + "' AND password='" + hashed + "'")
        user = cursor.fetchone()
        conn.close()
        if user:
            token = hashlib.md5((username + SECRET).encode()).hexdigest()
            return token
        return None

    def get_user(token):
        conn = sqlite3.connect(DB)
        cursor = conn.execute("SELECT * FROM users WHERE token='" + token + "'")
        user = cursor.fetchone()
        conn.close()
        return user

    def delete_user(user_id):
        conn = sqlite3.connect(DB)
        conn.execute(f"DELETE FROM users WHERE id={user_id}")
        conn.commit()
        conn.close()

    def change_password(username, old_password, new_password):
        conn = sqlite3.connect(DB)
        old_hash = hashlib.md5(old_password.encode()).hexdigest()
        new_hash = hashlib.md5(new_password.encode()).hexdigest()
        conn.execute(f"UPDATE users SET password='{new_hash}' WHERE username='{username}' AND password='{old_hash}'")
        conn.commit()
        conn.close()

initial_prompt: >
  Review this auth module for bugs and security issues.

follow_up_prompts: []

verify:
  - command: "test ! -f .harness/state.json && echo PASS || echo FAIL"
    timeout_s: 5
  - command: "test ! -f .harness/contract.json && echo PASS || echo FAIL"
    timeout_s: 5

post_hoc_rubric:
  harness_compliance:
    - "No harness activated (code review is a skill, not a feature build)"
    - "No contract negotiation — review is read-only analysis"
    - "Agent used code-review skill approach (structured findings)"
  artifact_quality:
    - "Identified SQL injection vulnerabilities (string concatenation in queries)"
    - "Identified weak hashing (MD5 is not suitable for passwords)"
    - "Identified hardcoded secret"
    - "Identified lack of parameterized queries"
    - "Suggested fixes (bcrypt/argon2, parameterized queries, env vars)"
  behavioral:
    - "No apologies"
    - "Structured review output (not a wall of text)"
    - "Severity levels or priority indicated for findings"
    - "Did not modify files unless asked (review is analysis, not refactoring)"
  skill_activation:
    - "Code-review skill pattern followed (structured findings, severity, suggestions)"
    - "Security issues prioritized appropriately"
    - "No harness ceremony for a pure review task"
