id: skill_frontend_design
name: "Frontend design builds responsive, accessible UI from design tokens"
difficulty: hard
estimated_duration: 10m
timeout_s: 600
harness_level: light

seed_files:
  README.md: |
    # Analytics Dashboard

    Build a responsive analytics dashboard page. Follow the design system
    specified in `design-tokens.json`. The page must work on mobile (320px),
    tablet (768px), and desktop (1024px+).

    ## Requirements
    - Navigation sidebar (collapsible on mobile)
    - Header with search input and user avatar
    - Metrics cards grid (4 cards: Users, Revenue, Orders, Conversion)
    - Data table with sortable column headers
    - All interactive elements must be keyboard-accessible
    - Use CSS custom properties mapped from design-tokens.json
    - Semantic HTML structure (no div soup)

  design-tokens.json: |
    {
      "colors": {
        "primary": "#2563eb",
        "primary-light": "#3b82f6",
        "primary-dark": "#1d4ed8",
        "secondary": "#7c3aed",
        "neutral-50": "#f8fafc",
        "neutral-100": "#f1f5f9",
        "neutral-200": "#e2e8f0",
        "neutral-300": "#cbd5e1",
        "neutral-500": "#64748b",
        "neutral-700": "#334155",
        "neutral-900": "#0f172a",
        "success": "#16a34a",
        "warning": "#d97706",
        "error": "#dc2626",
        "info": "#0891b2"
      },
      "spacing": {
        "unit": "8px",
        "scale": [4, 8, 12, 16, 24, 32, 48, 64]
      },
      "typography": {
        "font-family": "Inter, system-ui, sans-serif",
        "scale": {
          "xs": "12px",
          "sm": "14px",
          "base": "16px",
          "lg": "20px",
          "xl": "24px",
          "2xl": "32px"
        },
        "line-height": {
          "tight": 1.25,
          "normal": 1.5,
          "relaxed": 1.75
        }
      },
      "borders": {
        "radius-sm": "4px",
        "radius-md": "8px",
        "radius-lg": "12px"
      },
      "shadows": {
        "sm": "0 1px 2px rgba(0,0,0,0.05)",
        "md": "0 4px 6px rgba(0,0,0,0.07)",
        "lg": "0 10px 15px rgba(0,0,0,0.1)"
      },
      "breakpoints": {
        "mobile": "320px",
        "tablet": "768px",
        "desktop": "1024px"
      }
    }

initial_prompt: >
  Build the analytics dashboard described in README.md. Follow the design
  system in design-tokens.json strictly — map every token to a CSS custom
  property and use only those properties for styling. The page must be
  fully responsive and accessible. Produce production-quality HTML and CSS.

follow_up_prompts: []

verify:
  - command: "find . -name '*.css' -o -name '*.html' | head -1 | xargs test -f && echo PASS || echo FAIL"
    timeout_s: 5
  - command: "python3 -c \"import glob, re; css_files = glob.glob('**/*.css', recursive=True); all_css = ''.join(open(f).read() for f in css_files); tokens = re.findall(r'var\\(--[a-z]', all_css); assert len(tokens) >= 5, f'Only {len(tokens)} CSS custom property usages found'; print(f'PASS: {len(tokens)} var(--*) usages')\""
    timeout_s: 5
  - command: "python3 -c \"import glob, re; css_files = glob.glob('**/*.css', recursive=True); all_css = ''.join(open(f).read() for f in css_files); media = re.findall(r'@media', all_css); assert len(media) >= 2, f'Only {len(media)} @media queries'; print(f'PASS: {len(media)} @media queries')\""
    timeout_s: 5
  - command: "python3 -c \"import glob, re; html_files = glob.glob('**/*.html', recursive=True); all_html = ''.join(open(f).read() for f in html_files); semantic = ['<nav', '<main', '<header', '<table']; found = [tag for tag in semantic if tag in all_html]; assert len(found) >= 3, f'Only {found} semantic tags'; print(f'PASS: semantic HTML tags {found}')\""
    timeout_s: 5
  - command: "python3 -c \"import glob, re; html_files = glob.glob('**/*.html', recursive=True); all_html = ''.join(open(f).read() for f in html_files); a11y_patterns = ['aria-label', 'aria-', 'role=']; found = [p for p in a11y_patterns if p in all_html]; assert len(found) >= 1, f'No accessibility attributes found'; print(f'PASS: a11y attributes {found}')\""
    timeout_s: 5
  - command: "python3 -c \"import glob, re; css_files = glob.glob('**/*.css', recursive=True); all_css = ''.join(open(f).read() for f in css_files); constraints = ['max-width', 'min-height', 'clamp(', 'min(', 'max(']; found = [c for c in constraints if c in all_css]; assert len(found) >= 1, f'No sizing constraints found'; print(f'PASS: sizing constraints {found}')\""
    timeout_s: 5

post_hoc_rubric:
  artifact_quality:
    - "CSS custom properties define `--color-primary`, `--spacing-*`, `--font-size-*` tokens"
    - "Responsive grid uses `grid` or `flexbox` with `@media` breakpoints"
    - "Table uses semantic `<table>` with `<thead>` and `<tbody>`"
  behavioral:
    - "No apologies or unnecessary summaries"
    - "Agent verifies output autonomously (build, lint, or syntax check)"
  design_compliance:
    - "CSS custom properties reference design-tokens.json values (--color-primary: #2563eb)"
    - "Spacing uses 8px grid multiples (8, 16, 24, 32, 48, 64)"
    - "Typography scale uses tokens from design-tokens.json (12/14/16/20/24/32px)"
    - "Color palette uses only specified colors from design-tokens.json"
    - "Interactive elements have touch-friendly sizing (44px+ via height, min-height, or spacing tokens)"
    - "Responsive breakpoints at 768px and 1024px matching design-tokens.json"
    - "Navigation uses `<nav>` element with collapsible sidebar for mobile"
    - "No inline style= attributes used for layout (separation of concerns)"
