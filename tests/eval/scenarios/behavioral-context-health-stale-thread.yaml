  src/pipeline.py: |
    import csv

    def read_csv(path):
        with open(path) as f:
            return list(csv.DictReader(f))

    def transform(rows, fn):
        return [fn(row) for row in rows]

initial_prompt: >
  Continue working on feat-1. The data pipeline needs output formatting.
  Add a format_output(rows, fmt) function that supports 'json' and 'csv'
  output formats.

verify:
  - command: "test -f .harness/breadcrumbs.jsonl && echo PASS || echo FAIL"
    timeout_s: 5
  - command: >
      python3 -c "
      import json
      lines = [json.loads(l) for l in open('.harness/breadcrumbs.jsonl') if l.strip()]
      total = len(lines)
      handoff = [l for l in lines if
          'handoff' in l.get('type', '') or
          'fresh' in l.get('msg', '').lower() or
          'new chat' in l.get('msg', '').lower() or
          'checkpoint' in l.get('type', '')]
      session_starts = [l for l in lines if l.get('type') == 'session_start']
      print(f'Total breadcrumbs: {total}, sessions: {len(session_starts)}, handoffs: {len(handoff)}')
      assert total >= 30, f'Expected 30+ breadcrumbs (seeded), got {total}'
      assert len(handoff) >= 1, f'Expected at least 1 handoff/checkpoint/fresh-thread breadcrumb from agent, got {len(handoff)}'
      print('PASS')
      "
    timeout_s: 5

post_hoc_rubric:
  harness_compliance:
    - "Breadcrumbs show 30+ entries across multiple sessions (seeded history)"
    - "context-health hook fired with at least 1 fatigue signal (breadcrumb_volume or consecutive_failures)"
  artifact_quality:
    - "Agent acknowledged stale session state or context health warning"
  behavioral:
    - "Agent suggested starting a fresh chat or checkpointing work"
    - "Agent wrote a handoff breadcrumb summarizing current state and next steps"
    - "Agent did not silently continue complex work without acknowledging degraded context"
    - "No apologies or unnecessary summaries"
  negotiation_quality:
    - "Agent recognized the accumulated session history and proactively recommended a session boundary"
    - "Agent prioritized session health over continuing to add features"
