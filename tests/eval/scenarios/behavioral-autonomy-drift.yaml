    {"ts":"2026-06-01T11:00:00Z","role":"builder","type":"negotiate","feat":"feat-2","msg":"Proposed contract: 3 criteria, 2 edge cases"}
    {"ts":"2026-06-01T11:05:00Z","role":"evaluator","type":"negotiate","feat":"feat-2","msg":"Accepted contract"}
