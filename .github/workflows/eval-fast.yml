name: Eval Fast (static checks)

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  fast-check:
    name: Static eval checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r tests/eval/requirements.txt

      - name: Sync library → .cursor
        run: make sync-local

      - name: pytest (unit tests)
        run: pytest tests/ -v --tb=short

      - name: Eval fast (contract + harness lint)
        run: make eval-fast
