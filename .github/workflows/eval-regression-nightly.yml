name: Eval Regression (Nightly — full suite)

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  eval-regression-nightly:
    name: Session eval — Nightly tier (31 scenarios)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r tests/eval/requirements.txt

      - name: Sync library → .cursor
        run: make sync-local

      - name: Check CURSOR_API_KEY is configured
        run: |
          if [ -z "$CURSOR_API_KEY" ]; then
            echo "Error: Configure CURSOR_API_KEY repository secret to enable nightly eval."
            exit 1
          fi
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}

      - name: Run all scenarios (nightly tier)
        run: |
          python tests/eval/session_runner.py \
            --ci-tier nightly \
            --model composer-2.5 \
            --run-dir tests/eval_results/ci-nightly-${{ github.run_id }}
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}

      - name: Judge sessions
        run: |
          python tests/eval/session_judge.py \
            --run-dir tests/eval_results/ci-nightly-${{ github.run_id }} \
            --tier structural

      - name: Generate report
        run: |
          python tests/eval/session_report.py \
            --run-dir tests/eval_results/ci-nightly-${{ github.run_id }} \
            --save

      - name: Regression check
        run: |
          python tests/eval/eval_regression_check.py \
            --run-dir tests/eval_results/ci-nightly-${{ github.run_id }} \
            --baseline tests/eval/fixtures/eval_baseline.json \
            --tier nightly \
            --write-diff tests/eval_results/ci-nightly-${{ github.run_id }}/regression.json

      - name: Upload eval artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-nightly-${{ github.run_id }}
          path: |
            tests/eval_results/ci-nightly-${{ github.run_id }}/summary.json
            tests/eval_results/ci-nightly-${{ github.run_id }}/regression.json
            tests/eval_results/ci-nightly-${{ github.run_id }}/judgments/**
          retention-days: 30
